# Burrow's default settings, over the engine's own. The player's settings
# file, the command line, and the options menu override them. Each line is
# name = value; `burrow settings` lists every setting and where its value
# comes from.

# A shooter simulates at a steady tick and keeps its view wide.
engine.tick_rate = 60
graphics.field_of_view = 90

# The crosshair is part of the game's look, and the frame rate shows while
# the game is in graybox.
interface.crosshair = true
interface.performance_overlay = frame_rate

# The menus and the room are designed at 1920 by 1080, expanded to fill any
# window: a window of another shape shows more around the design, and the
# camera sees at least the design's view (docs/display.md). The bars show
# only where the player narrows the frame with display.aspect_ratio.
display.design_width = 1920
display.design_height = 1080
display.stretch_aspect = expand
display.stretch_scale_mode = fractional
display.bar_color = "#000000"
