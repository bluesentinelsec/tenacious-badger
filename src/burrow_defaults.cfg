# Burrow's default settings, over the engine's own. The player's settings
# file, the command line, and the options menu override them. Each line is
# name = value; `burrow settings` lists every setting and where its value
# comes from.

# A shooter simulates at a steady tick and keeps its view wide.
engine.tick_rate = 60
graphics.field_of_view = 90

# The crosshair is part of the game's look.
interface.crosshair = true
