name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Verify release version
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the tag to match the single version source
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  sanitizers:
    needs: version
    uses: ./.github/workflows/sanitizers.yml

  publish:
    name: Publish verified desktop exports
    needs: [ci, sanitizers]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist
      - name: Verify all three exports and collect checksums
        run: python3 tools/release_checksums.py dist
      - name: Publish the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh config set git_protocol ssh --host github.com
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --title "Tenacious Badger $GITHUB_REF_NAME" \
            --notes-file docs/release-notes.md --latest
