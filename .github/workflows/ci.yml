name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        toolchain: [windows-msvc, macos-clang, linux-gcc, linux-clang]
        include:
          - toolchain: windows-msvc
            platform: Windows
            os: windows-2025-vs2026
            compiler: MSVC
            cc: cl
          - toolchain: macos-clang
            platform: macOS
            os: macos-26
            compiler: AppleClang
            cc: clang
          - toolchain: linux-gcc
            platform: Linux
            os: ubuntu-26.04
            compiler: GCC
            cc: gcc
          - toolchain: linux-clang
            platform: Linux
            os: ubuntu-26.04
            compiler: Clang
            cc: clang
    env:
      CC: ${{ matrix.cc }}
      CMAKE_GENERATOR: ${{ matrix.os == 'windows-2025-vs2026' && 'Visual Studio 18 2026' || 'Unix Makefiles' }}
      CMAKE_GENERATOR_PLATFORM: ${{ matrix.os == 'windows-2025-vs2026' && 'x64' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build/ci --config ${{ matrix.build_type }} --parallel
      - name: Test shared library, consumer, and native adapter
        run: ctest --test-dir build/ci -C ${{ matrix.build_type }} --output-on-failure --no-tests=error
      - name: Install the dynamic/static SDK and public headers
        run: cmake --install build/ci --config ${{ matrix.build_type }} --prefix stage/sdk
      - name: Invoke the installed shared library from Python ctypes
        run: python3 tests/ffi/ctypes_smoke.py --prefix stage/sdk
      - name: Exercise foundation APIs through independent installed-SDK utilities
        run: python3 tools/verify_foundation.py --prefix stage/sdk --configuration ${{ matrix.build_type }}
      - name: Configure an independent static-library consumer
        run: cmake -S tests/consumers/static -B build/static-consumer -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/stage/sdk"
      - name: Build the independent static-library consumer
        run: cmake --build build/static-consumer --config ${{ matrix.build_type }} --parallel
      - name: Run the independent static-library consumer
        run: ctest --test-dir build/static-consumer -C ${{ matrix.build_type }} --output-on-failure --no-tests=error
      - name: Configure a FetchContent shared-library consumer without downloads
        run: cmake -S tests/consumers/fetch -B build/fetch-consumer -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} "-DTB_SOURCE_ROOT=${{ github.workspace }}"
      - name: Build the FetchContent consumer
        run: cmake --build build/fetch-consumer --config ${{ matrix.build_type }} --parallel
      - name: Run the FetchContent consumer
        run: ctest --test-dir build/fetch-consumer -C ${{ matrix.build_type }} --output-on-failure --no-tests=error
      - name: Package, extract, and launch the native desktop export
        if: matrix.build_type == 'Release' && matrix.toolchain != 'linux-clang'
        run: python3 tools/package_desktop.py --build build/ci --output dist
      - name: Package and externally invoke the dynamic/static SDK
        if: matrix.toolchain != 'linux-clang'
        run: python3 tools/package_sdk.py --build build/ci --prefix stage/sdk --configuration ${{ matrix.build_type }} --output dist
      - name: Save verified desktop export
        if: matrix.toolchain != 'linux-clang'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.toolchain }}-${{ matrix.build_type }}
          path: dist/*
          if-no-files-found: error

  default-adapter:
    name: Default platform adapter
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure the engine as an unsupported platform would be, with the default adapter
        run: >
          cmake -S . -B build/default-adapter -DCMAKE_BUILD_TYPE=Debug
          -DTB_USE_DEFAULT_PLATFORM_ADAPTER=ON
          -DTB_BUILD_BURROW=OFF -DTB_BUILD_TESTS=OFF -DTB_BUILD_BENCHMARKS=OFF
      - name: Build the shared and static libraries
        run: cmake --build build/default-adapter --parallel

  analysis:
    name: Static analysis / ${{ matrix.platform }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-2025-vs2026
            compiler: MSVC
            cc: cl
          - platform: macOS
            os: macos-26
            compiler: AppleClang
            cc: clang
            target: tb_analyze
          - platform: Linux
            os: ubuntu-26.04
            compiler: GCC
            cc: gcc
          - platform: Linux
            os: ubuntu-26.04
            compiler: Clang
            cc: clang
            target: tb_analyze
    env:
      CC: ${{ matrix.cc }}
      CMAKE_GENERATOR: ${{ matrix.os == 'windows-2025-vs2026' && 'Visual Studio 18 2026' || 'Unix Makefiles' }}
      CMAKE_GENERATOR_PLATFORM: ${{ matrix.os == 'windows-2025-vs2026' && 'x64' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the analyzer driver against arguments with known answers
        run: python3 tools/analyze_with_clang.py --self-test
      # MSVC and GCC analyze as they compile, so their analysis is the build.
      # Clang's is the tb_analyze target, which compiles nothing.
      - name: Configure the engine alone, with the compiler's static analyzer
        run: >
          cmake -S . -B build/analyze -DCMAKE_BUILD_TYPE=Debug
          -DTB_ENABLE_STATIC_ANALYSIS=ON -DTB_BUILD_TESTS=OFF -DTB_BUILD_BENCHMARKS=OFF
          -DTB_WINDOWS_SELF_SIGN=OFF
      - name: Analyze every source of the engine
        run: >
          cmake --build build/analyze --config Debug --parallel
          ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

  format:
    name: C formatting
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check with the runner's preinstalled clang-format 22
        run: cmake -DTB_FORMAT_MODE=check -DTB_CLANG_FORMAT=clang-format-22 -P cmake/Format.cmake

  foundation:
    name: Foundation layer use
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the checker against sources with known answers
        run: python3 tools/check_foundation.py --self-test
      - name: Check that C code uses the foundation layer, not the C library it replaces
        run: python3 tools/check_foundation.py
      - name: Check the contract checker against headers with known answers
        run: python3 tools/check_contracts.py --self-test
      - name: Check that every public function states its threading contract
        run: python3 tools/check_contracts.py
      - name: Check the text checker against bytes with known answers
        run: python3 tools/check_text.py --self-test
      - name: Check that no tracked text file begins with a byte-order mark
        run: python3 tools/check_text.py

  coverage:
    name: Coverage / ${{ matrix.platform }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-26.04
            compiler: GCC
            cc: gcc
            gcov: gcov
          - platform: macOS
            os: macos-26
            compiler: AppleClang
            cc: clang
            gcov: xcrun llvm-cov gcov
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the coverage check against reports with known answers
        run: python3 tools/check_coverage.py --self-test
      - name: Build with the compiler's coverage instrumentation
        run: >
          cmake -S . -B build/coverage -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=${{ matrix.cc }} -DTB_ENABLE_COVERAGE=ON
          -DTB_BUILD_BENCHMARKS=OFF
      - run: cmake --build build/coverage --parallel
      - name: Run every test
        run: ctest --test-dir build/coverage --output-on-failure --timeout 120 --no-tests=error
      - name: Temporary diagnosis of the default adapter's counts
        run: |
          find build/coverage -name "*.gcda" | grep -c . || true
          find build/coverage -path "*default_probe*" -name "*.gc*" | head -20 || true
          build/coverage/bin/tb_platform_default_probe platform_default.tb_vm_reserve || true
          find build/coverage -path "*default_probe*" -name "*.gcda" | head -20 || true
          ls build/coverage/bin | head -30
      - name: Require 80 percent of the lines of every engine source to be run
        run: python3 tools/check_coverage.py build/coverage --gcov "${{ matrix.gcov }}"

  coverage-windows:
    name: Coverage / Windows / MSVC
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    env:
      CMAKE_GENERATOR: Visual Studio 18 2026
      CMAKE_GENERATOR_PLATFORM: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cmake -S . -B build/coverage -DTB_BUILD_BENCHMARKS=OFF -DTB_WINDOWS_SELF_SIGN=OFF
      - run: cmake --build build/coverage --config Debug --parallel
      # MSVC has no coverage flag. The collector that ships with Visual Studio
      # watches the tests as they run and needs nothing from the build. It
      # moves functions to do so, which fails the two cases that compare the
      # addresses of functions; whether the tests pass is the business of the
      # ordinary jobs, and here only what they ran is looked at.
      - name: Run every test under the Visual Studio coverage collector
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $collector = & $vswhere -latest -find "**\Microsoft.CodeCoverage.Console.exe" | Select-Object -First 1
          if (-not $collector) { throw "Visual Studio on this runner has no Microsoft.CodeCoverage.Console.exe" }
          & $collector collect -o build\coverage\coverage.xml -f cobertura ctest --test-dir build/coverage -C Debug --timeout 300
          if (-not (Test-Path build\coverage\coverage.xml)) { throw "The collector wrote no report" }
          exit 0
      - name: Require 80 percent of the lines of every engine source to be run
        run: python tools/check_coverage.py --cobertura build/coverage/coverage.xml
