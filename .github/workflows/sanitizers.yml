name: Sanitizers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A push to a pull request makes the runs of its earlier commits pointless:
# they are cancelled, so that the new one does not wait behind them. Runs on
# main are never cancelled, so that every commit there is checked.
concurrency:
  group: sanitizers-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sanitizer:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            compiler: MSVC ASan
            cc: cl
            option: TB_ENABLE_SANITIZERS
          - os: macos-26
            compiler: AppleClang ASan + UBSan
            cc: clang
            option: TB_ENABLE_SANITIZERS
          - os: ubuntu-26.04
            compiler: GCC ASan + UBSan
            cc: gcc
            option: TB_ENABLE_SANITIZERS
          - os: ubuntu-26.04
            compiler: Clang ASan + UBSan
            cc: clang
            option: TB_ENABLE_SANITIZERS
          # ThreadSanitizer cannot share an executable with AddressSanitizer,
          # so it has jobs of its own. MSVC has none.
          - os: macos-26
            compiler: AppleClang TSan
            cc: clang
            option: TB_ENABLE_THREAD_SANITIZER
          - os: ubuntu-26.04
            compiler: GCC TSan
            cc: gcc
            option: TB_ENABLE_THREAD_SANITIZER
          - os: ubuntu-26.04
            compiler: Clang TSan
            cc: clang
            option: TB_ENABLE_THREAD_SANITIZER
    env:
      CC: ${{ matrix.cc }}
      CMAKE_GENERATOR: ${{ matrix.os == 'windows-2025-vs2026' && 'Visual Studio 18 2026' || 'Unix Makefiles' }}
      CMAKE_GENERATOR_PLATFORM: ${{ matrix.os == 'windows-2025-vs2026' && 'x64' || '' }}
      ASAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add the installed MSVC AddressSanitizer runtime to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC installation not found' }
          $version = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt" -Raw).Trim()
          $tools = "$vs\VC\Tools\MSVC\$version\bin\Hostx64\x64"
          if (-not (Test-Path "$tools\clang_rt.asan_dynamic-x86_64.dll")) { throw 'MSVC ASan runtime not found' }
          $tools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure standalone Debug sanitizer tests
        run: cmake -S . -B build/sanitizer -DCMAKE_BUILD_TYPE=Debug -D${{ matrix.option }}=ON
      - name: Build
        run: cmake --build build/sanitizer --config Debug --parallel
      # Under a sanitizer, and above all under ThreadSanitizer on macOS, every
      # test process is slow to start, so the tests run side by side on every
      # core of the runner. A test that outlives the limit fails by name, rather
      # than the job running out of time with no test to blame.
      - name: Test
        run: ctest --test-dir build/sanitizer -C Debug --output-on-failure --no-tests=error --parallel --timeout 300
